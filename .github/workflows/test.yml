name: Tests

on:
  push:
    branches: [ "main", "feature/*" ]
    paths:
      - '**.py'
      - 'requirements*.txt'
      - 'constraints.txt'
      - 'pyproject.toml'
      - 'tests/**'
      - 'frontend/**'
      - 'static/dist/**'
      - 'dw'
      - '*.sh'
      - 'scripts/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**.py'
      - 'requirements*.txt'
      - 'constraints.txt'
      - 'pyproject.toml'
      - 'tests/**'
      - 'frontend/**'
      - 'static/dist/**'
      - 'dw'
      - '*.sh'
      - 'scripts/**'
      - '.github/workflows/test.yml'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  # Backend tests
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = Raspberry Pi OS Bookworm, 3.13 = Trixie
        python-version: ['3.11', '3.13']
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install lgpio build deps
        # lgpio has no wheel for Python 3.13, so pip builds it from source
        # (same as on a Trixie Pi, where setup-pi.sh provides the library)
        run: sudo apt-get update -q && sudo apt-get install -y -q liblgpio-dev swig

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Same pinned versions the Pi installs (see constraints.txt)
          pip install -r requirements.txt -c constraints.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests with coverage
        env:
          CI: true
        run: |
          pytest tests/unit/ -v --cov=modules --cov=main --cov-report=xml --cov-report=term-missing

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        # Only when the repo has a CODECOV_TOKEN secret, and once per run
        if: always() && env.CODECOV_TOKEN != '' && matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  lint:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff (blocking) - syntax errors, undefined names, unused imports
        run: |
          ruff check --output-format=github --select E9,F63,F7,F82,F401,F541 .

      - name: Ruff (advisory) - full rule set
        run: |
          ruff check --output-format=github .
        continue-on-error: true

      - name: ShellCheck install/update scripts
        run: |
          shellcheck -S warning dw setup-pi.sh scripts/*.sh

  # The Pi serves the committed static/dist, so it must match the frontend source
  frontend-dist:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Check static/dist is up to date
        run: |
          if [ -n "$(git status --porcelain static/dist)" ]; then
            echo "::error::static/dist is out of date. Run 'cd frontend && npm ci && npm run build' and commit static/dist."
            git status --short static/dist | head -20
            # sw.js is one minified line; split it so the diff is readable
            diff <(git show HEAD:static/dist/sw.js | tr ',' '\n') <(tr ',' '\n' < static/dist/sw.js) | head -40 || true
            exit 1
          fi

  # Frontend unit/integration tests
  frontend-test:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest tests
        run: npm test

      - name: Run Vitest with coverage
        run: npm run test:coverage
        continue-on-error: true

  # Frontend E2E tests
  frontend-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
